<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="620" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">What rate limiting actually buys you</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">One misbehaving client should not be able to hurt everyone else</text><rect x="60" y="140" width="520" height="360" rx="12" fill="#101829" stroke="#F87171" stroke-width="1.5" opacity="1"/><text x="320" y="174" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="1.6">WITHOUT A LIMIT</text><rect x="110" y="230" width="160" height="70" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="190" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Buggy client</text><text x="190" y="285" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">retry loop</text><line x1="278" y1="265" x2="362" y2="265" stroke="#F87171" stroke-width="2.4" stroke-linecap="round" opacity="1" marker-end="url(#arwBad)"/><text x="320" y="214" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">1,000 req/s</text><rect x="370" y="230" width="160" height="70" rx="12" fill="#141E35" stroke="#F87171" stroke-width="1.5" opacity="1"/><text x="450" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">API server</text><text x="450" y="285" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">CPU 100%</text><circle cx="121" cy="356" r="11" fill="none" stroke="#F87171" stroke-width="2.2" opacity="1"/><path d="M 116.16 351.16 L 125.84 360.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><path d="M 125.84 351.16 L 116.16 360.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="144" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Server CPU pinned at 100%</text><circle cx="121" cy="400" r="11" fill="none" stroke="#F87171" stroke-width="2.2" opacity="1"/><path d="M 116.16 395.16 L 125.84 404.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><path d="M 125.84 395.16 L 116.16 404.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="144" y="406" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Every other user sees timeouts</text><circle cx="121" cy="444" r="11" fill="none" stroke="#F87171" stroke-width="2.2" opacity="1"/><path d="M 116.16 439.16 L 125.84 448.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><path d="M 125.84 439.16 L 116.16 448.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="144" y="450" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">One client degrades the whole API</text><rect x="620" y="140" width="520" height="360" rx="12" fill="#101829" stroke="#34D399" stroke-width="1.5" opacity="1"/><text x="880" y="174" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="1.6">WITH A RATE LIMITER</text><rect x="645" y="230" width="130" height="70" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="710" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Buggy client</text><text x="710" y="285" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">retry loop</text><line x1="778" y1="265" x2="801" y2="265" stroke="#F87171" stroke-width="2.4" stroke-linecap="round" opacity="1" marker-end="url(#arwBad)"/><text x="786" y="206" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">1,000/s</text><rect x="805" y="230" width="150" height="70" rx="12" fill="#141E35" stroke="#60A5FA" stroke-width="1.5" opacity="1"/><text x="880" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">Rate limiter</text><text x="880" y="285" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">per user</text><line x1="958" y1="265" x2="981" y2="265" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" opacity="1" marker-end="url(#arwGood)"/><text x="974" y="206" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">100/s</text><rect x="985" y="230" width="130" height="70" rx="12" fill="#141E35" stroke="#34D399" stroke-width="1.5" opacity="1"/><text x="1050" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">API server</text><text x="1050" y="285" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">healthy</text><circle cx="656" cy="356" r="11" fill="none" stroke="#34D399" stroke-width="2.2" opacity="1"/><path d="M 651.05 356 L 655.12 360.18 L 661.5 351.6" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="679" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Client capped at 100 req/s</text><circle cx="656" cy="400" r="11" fill="none" stroke="#34D399" stroke-width="2.2" opacity="1"/><path d="M 651.05 400 L 655.12 404.18 L 661.5 395.6" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="679" y="406" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">The other 900 get a clean 429</text><circle cx="656" cy="444" r="11" fill="none" stroke="#34D399" stroke-width="2.2" opacity="1"/><path d="M 651.05 444 L 655.12 448.18 L 661.5 439.6" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="679" y="450" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Everyone else is unaffected</text><line x1="80" y1="526" x2="1120" y2="526" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Rate limiting is not about punishing users. It is about protecting the service for all of them.</text>
</svg>