<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="780" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">No single limiter is enough</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Six layers, each catching what the one above it is blind to</text><line x1="56" y1="158" x2="56" y2="700" stroke="#26334F" stroke-width="2.4" stroke-linecap="round" opacity="1" stroke-dasharray="6 6" marker-end="url(#arw)"/><text x="48" y="138" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1" letter-spacing="0">request</text><rect x="86" y="152" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="162" x2="86" y2="226" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="194" x2="82" y2="194" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="186" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">1</text><text x="130" y="184" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">Edge / CDN</text><text x="376" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Volumetric floods and scrapers, keyed on IP or fingerprint,</text><text x="376" y="199" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">before a byte reaches you.</text><text x="846" y="182" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">The provider's edge</text><text x="846" y="204" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cannot tell a paying customer from a</text><text x="846" y="220" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">free one</text><rect x="86" y="246" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="256" x2="86" y2="320" stroke="#34D399" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="288" x2="82" y2="288" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="280" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">2</text><text x="130" y="278" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">Request rate limiter</text><text x="376" y="274" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">The runaway script. N requests per second per customer, with</text><text x="376" y="293" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">a bounded burst.</text><text x="846" y="276" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Redis, token bucket</text><text x="846" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cannot see how long a request takes</text><rect x="86" y="340" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="350" x2="86" y2="414" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="382" x2="82" y2="382" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="374" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">3</text><text x="130" y="372" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">Concurrency limiter</text><text x="376" y="368" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Resource contention on slow, expensive endpoints. Caps</text><text x="376" y="387" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">requests in flight.</text><text x="846" y="370" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Redis or in-process</text><text x="846" y="392" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cannot price one request against another</text><rect x="86" y="434" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="444" x2="86" y2="508" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="476" x2="82" y2="476" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="468" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">4</text><text x="130" y="466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">Cost / quota accounting</text><text x="376" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">The expensive query and the monthly bill. Meters units, not</text><text x="376" y="481" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">calls.</text><text x="846" y="464" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Redis + Postgres</text><text x="846" y="486" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cannot help once the box itself is</text><text x="846" y="502" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">saturated</text><rect x="86" y="528" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="538" x2="86" y2="602" stroke="#F0A4C0" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="570" x2="82" y2="570" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="562" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#F0A4C0" text-anchor="start" opacity="1" letter-spacing="0">5</text><text x="130" y="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#F0A4C0" text-anchor="start" opacity="1" letter-spacing="0">Fleet load shedder</text><text x="376" y="556" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Reserves a slice of the fleet for critical calls. Sheds the</text><text x="376" y="575" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">rest with a 503.</text><text x="846" y="558" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Redis counters</text><text x="846" y="580" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Decides globally, so one hot box still</text><text x="846" y="596" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">suffers</text><rect x="86" y="622" width="1044" height="84" rx="12" fill="#101829" stroke="#26334F" stroke-width="1.2" opacity="1"/><line x1="86" y1="632" x2="86" y2="696" stroke="#F87171" stroke-width="4" stroke-linecap="round" opacity="1"/><line x1="62" y1="664" x2="82" y2="664" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="108" y="656" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">6</text><text x="130" y="654" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">Worker load shedder</text><text x="376" y="650" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Last line of defence. As workers saturate, drops the least</text><text x="376" y="669" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">critical class first.</text><text x="846" y="652" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">In-process</text><text x="846" y="674" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Nothing left behind it. This is the</text><text x="846" y="690" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">floor.</text><text x="376" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">WHAT IT CATCHES</text><text x="846" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">WHERE THE STATE LIVES  ·  ITS BLIND SPOT</text><line x1="80" y1="710" x2="1120" y2="710" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="744" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Layers 2 to 6 are roughly the set Stripe describes running in production. Start with layer 2.</text>
</svg>