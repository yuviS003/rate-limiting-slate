d" opacity="1" marker-end="url(#arwGood)"/><line x1="880" y1="374" x2="880" y2="408" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arwGood)"/><line x1="1014" y1="374" x2="928" y2="408" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arwGood)"/><rect x="755" y="410" width="250" height="50" rx="8" fill="#10261F" stroke="#34D399" stroke-width="1.6" opacity="1"/><text x="880" y="432" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">Redis  (shared)</text><text x="880" y="452" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">count: 100</text><line x1="660" y1="492" x2="1100" y2="492" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="880" y="526" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">Real limit: 100 / min</text><text x="880" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">one counter, all processes agree</text><line x1="80" y1="616" x2="1120" y2="616" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="650" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">A rate limiter is only as correct as the store behind it. Memory stores silently multiply your limit by the instance count.</text>
