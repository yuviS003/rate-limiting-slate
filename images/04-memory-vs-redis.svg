<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">The bug that only shows up in production</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">The limit is 100 requests per minute per user, and the app runs on three instances</text><rect x="60" y="150" width="520" height="420" rx="12" fill="#101829" stroke="#F87171" stroke-width="1.5" opacity="1"/><text x="320" y="184" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="1.6">COUNTER IN PROCESS MEMORY</text><rect x="220" y="206" width="200" height="50" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="320" y="237.12" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Load balancer</text><line x1="320" y1="258" x2="186" y2="298" stroke="#26334F" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="120" y="300" width="132" height="72" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="186" y="332" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Node</text><text x="186" y="356" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">instance</text><line x1="320" y1="258" x2="320" y2="298" stroke="#26334F" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="254" y="300" width="132" height="72" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity=