-anchor="middle" opacity="1" letter-spacing="0">in memory</text><text x="320" y="452" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">count: 100</text><line x1="454" y1="374" x2="454" y2="408" stroke="#F87171" stroke-width="1.6" stroke-linecap="round" opacity="1" marker-end="url(#arwBad)"/><rect x="388" y="410" width="132" height="50" rx="8" fill="#2A1518" stroke="#F87171" stroke-width="1.4" opacity="1"/><text x="454" y="432" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">in memory</text><text x="454" y="452" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">count: 100</text><line x1="100" y1="492" x2="540" y2="492" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="320" y="526" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">Real limit: 300 / min</text><text x="320" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">every process counts on its own</text><rect x="620" y="150" width="520" height="420" rx="12" fill="#101829" stroke="#34D399" stroke-width="1.5" opacity="1"/><text x="880" y="184" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="1.6">COUNTER IN SHARED REDIS</text><rect x="780" y="206" width="200" height="50" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="880" y="237.12" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="