<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="780" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">Which limiter do I actually need?</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">A decision tree for the Monday after you finish this article</text><rect x="450" y="132" width="300" height="64" rx="12" fill="#101829" stroke="#60A5FA" stroke-width="1.6" opacity="1"/><text x="600" y="163" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">What are you protecting?</text><rect x="70" y="268" width="230" height="82" rx="12" fill="#141E35" stroke="#60A5FA" stroke-width="1.8" opacity="1"/><text x="185" y="299" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">FAIRNESS</text><text x="185" y="323" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">One caller must not consume</text><text x="185" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">everyone else's share.</text><rect x="355" y="268" width="230" height="82" rx="12" fill="#141E35" stroke="#FBBF24" stroke-width="1.8" opacity="1"/><text x="470" y="299" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">AN EXPENSIVE THING</text><text x="470" y="323" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">CPU, DB connections, LLM tokens,</text><text x="470" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">or money.</text><rect x="640" y="268" width="230" height="82" rx="12" fill="#141E35" stroke="#F87171" stroke-width="1.8" opacity="1"/><text x="755" y="299" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">THE WHOLE SERVICE</text><text x="755" y="323" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">The fleet is already slowing</text><text x="755" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">down.</text><rect x="925" y="268" width="230" height="82" rx="12" fill="#141E35" stroke="#A78BFA" stroke-width="1.8" opacity="1"/><text x="1040" y="299" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">AN UPSTREAM API</text><text x="1040" y="323" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">You are the client receiving</text><text x="1040" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">429s.</text><path d="M 498 196 L 185 262" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="341.5" y="229" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">per caller</text><path d="M 548 196 L 470 262" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="509" y="229" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">resource</text><path d="M 652 196 L 755 262" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="703.5" y="229" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">global</text><path d="M 702 196 L 1040 262" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="871" y="229" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">outbound</text><rect x="60" y="404" width="250" height="64" rx="12" fill="#101829" stroke="#60A5FA" stroke-width="1.6" opacity="1"/><text x="185" y="435" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Do short bursts need to</text><text x="185" y="457" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">work?</text><rect x="25" y="540" width="150" height="90" rx="12" fill="#141E35" stroke="#34D399" stroke-width="1.8" opacity="1"/><text x="100" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">TOKEN BUCKET</text><text x="100" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Usually yes. Best</text><text x="100" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">default.</text><rect x="195" y="540" width="150" height="90" rx="12" fill="#141E35" stroke="#60A5FA" stroke-width="1.8" opacity="1"/><text x="270" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">SLIDING WINDOW</text><text x="270" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Exact trailing</text><text x="270" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">fairness.</text><path d="M 130 468 L 100 534" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="115" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">yes</text><path d="M 240 468 L 270 534" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="255" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">no / exact</text><rect x="350" y="404" width="250" height="64" rx="12" fill="#101829" stroke="#FBBF24" stroke-width="1.6" opacity="1"/><text x="475" y="435" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Is the cost held over</text><text x="475" y="457" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">time?</text><rect x="355" y="540" width="145" height="90" rx="12" fill="#141E35" stroke="#A78BFA" stroke-width="1.8" opacity="1"/><text x="427.5" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">CONCURRENCY</text><text x="427.5" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Cap work in</text><text x="427.5" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">flight.</text><rect x="515" y="540" width="145" height="90" rx="12" fill="#141E35" stroke="#FBBF24" stroke-width="1.8" opacity="1"/><text x="587.5" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">COST BUDGET</text><text x="587.5" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Spend weighted</text><text x="587.5" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">units.</text><path d="M 435 468 L 428 534" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="431.5" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">yes</text><path d="M 535 468 L 588 534" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="561.5" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">no</text><rect x="640" y="404" width="250" height="64" rx="12" fill="#101829" stroke="#F87171" stroke-width="1.6" opacity="1"/><text x="765" y="435" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Can latency tell you</text><text x="765" y="457" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">early?</text><rect x="675" y="540" width="145" height="90" rx="12" fill="#141E35" stroke="#34D399" stroke-width="1.8" opacity="1"/><text x="747.5" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">ADAPTIVE</text><text x="747.5" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Shrink before</text><text x="747.5" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">errors.</text><rect x="835" y="540" width="145" height="90" rx="12" fill="#141E35" stroke="#F87171" stroke-width="1.8" opacity="1"/><text x="907.5" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">LOAD SHEDDER</text><text x="907.5" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Drop low priority</text><text x="907.5" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">first.</text><path d="M 725 468 L 748 534" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="736.5" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">yes</text><path d="M 830 468 L 908 534" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="869" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1" letter-spacing="0">already on fire</text><rect x="930" y="404" width="230" height="64" rx="12" fill="#101829" stroke="#A78BFA" stroke-width="1.6" opacity="1"/><text x="1045" y="435" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Did it send Retry-After?</text><rect x="995" y="540" width="170" height="90" rx="12" fill="#141E35" stroke="#A78BFA" stroke-width="1.8" opacity="1"/><text x="1080" y="571" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">BACKOFF + JITTER</text><text x="1080" y="595" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Respect the header.</text><text x="1080" y="612" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Otherwise use full</text><text x="1080" y="629" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">jitter.</text><path d="M 1045 468 L 1080 534" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="1062.5" y="501" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">either way</text><line x1="90" y1="680" x2="1110" y2="680" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="716" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">These compose. A mature API normally runs several at once because each answers a different question.</text><text x="600" y="748" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Start with token bucket per authenticated customer. Add the next layer only when its failure appears.</text>
</svg>