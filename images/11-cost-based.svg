<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="700" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">Four requests. One of them is not like the others.</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Every rate limiter so far has assumed a request is a unit of work. Look what that assumes away.</text><rect x="70" y="170" width="1060" height="60" rx="10" fill="#101829" stroke="none" stroke-width="0" opacity="1"/><line x1="80" y1="180" x2="80" y2="220" stroke="#34D399" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="100" y="198" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">GET /health</text><text x="100" y="218" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">a status check</text><rect x="560" y="188" width="6" height="24" rx="6" fill="#34D399" stroke="none" stroke-width="0" opacity="0.85"/><text x="580" y="206" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">1</text><rect x="70" y="244" width="1060" height="60" rx="10" fill="none" stroke="none" stroke-width="0" opacity="1"/><line x1="80" y1="254" x2="80" y2="294" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="100" y="272" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">GET /search?q=…</text><text x="100" y="292" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">hits the search index</text><rect x="560" y="262" width="108.34036004913148" height="24" rx="6" fill="#60A5FA" stroke="none" stroke-width="0" opacity="0.85"/><text x="682.3403600491315" y="280" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">20</text><rect x="70" y="318" width="1060" height="60" rx="10" fill="#101829" stroke="none" stroke-width="0" opacity="1"/><line x1="80" y1="328" x2="80" y2="368" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="100" y="346" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">POST /chat</text><text x="100" y="366" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">3,000 LLM tokens</text><rect x="560" y="336" width="289.5494876569395" height="24" rx="6" fill="#FBBF24" stroke="none" stroke-width="0" opacity="0.85"/><text x="863.5494876569395" y="354" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">3,000</text><rect x="70" y="392" width="1060" height="60" rx="10" fill="none" stroke="none" stroke-width="0" opacity="1"/><line x1="80" y1="402" x2="80" y2="442" stroke="#F87171" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="100" y="420" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">GraphQL, 3 levels deep</text><text x="100" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">users(100){posts(100){comments(100)}}</text><rect x="560" y="410" width="500" height="24" rx="6" fill="#F87171" stroke="none" stroke-width="0" opacity="0.85"/><text x="1074" y="428" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">1,010,100</text><text x="560" y="158" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.2">COST  (log scale, or the first three would be invisible)</text><rect x="70" y="486" width="520" height="112" rx="12" fill="#101829" stroke="#F87171" stroke-width="1.6" opacity="1"/><text x="94" y="518" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="1.4">COUNTING REQUESTS</text><text x="94" y="550" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">4 of 5 used</text><circle cx="300" cy="543" r="11" fill="none" stroke="#34D399" stroke-width="2.2" opacity="1"/><path d="M 295.05 543 L 299.12 547.18 L 305.5 538.6" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="320" y="549" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">under the limit, allowed</text><text x="94" y="578" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">The last request was 1,010,100x the first one.</text><rect x="610" y="486" width="520" height="112" rx="12" fill="#101829" stroke="#34D399" stroke-width="1.6" opacity="1"/><text x="634" y="518" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="1.4">COUNTING COST</text><text x="634" y="550" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">1,013,121 units</text><circle cx="866" cy="543" r="11" fill="none" stroke="#F87171" stroke-width="2.2" opacity="1"/><path d="M 861.16 538.16 L 870.84 547.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><path d="M 870.84 538.16 L 861.16 547.84" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" opacity="1"/><text x="886" y="549" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">rejected, correctly</text><text x="634" y="578" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Shopify, GitHub and OpenAI all meter this way.</text><line x1="80" y1="634" x2="1120" y2="634" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="668" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">Price the request before you run it. For LLM calls you cannot, so reserve an estimate and settle the difference after.</text>
</svg>