<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="780" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">Four algorithms, one cheat sheet</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">They all cap traffic. What differs is how they treat a burst.</text><text x="72" y="162" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">ALGORITHM</text><text x="292" y="162" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">HOW IT WORKS</text><text x="680" y="162" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">BURSTS?</text><text x="872" y="162" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">REACH FOR IT WHEN</text><line x1="72" y1="178" x2="1128" y2="178" stroke="#26334F" stroke-width="1.4" stroke-linecap="round" opacity="1"/><rect x="60" y="194" width="1080" height="114" rx="10" fill="#101829" stroke="none" stroke-width="0" opacity="1"/><line x1="72" y1="204" x2="72" y2="298" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="90" y="242" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">Fixed window</text><text x="292" y="236" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Count requests in a clock-aligned bucket.</text><text x="292" y="260" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">The counter resets at the top of every</text><text x="292" y="284" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">window.</text><text x="680" y="236" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">Yes — up to 2x at the</text><text x="680" y="260" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">boundary</text><text x="872" y="236" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">You want the simplest thing that</text><text x="872" y="259" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">works and rough limits are fine.</text><line x1="72" y1="330" x2="72" y2="424" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="90" y="368" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">Sliding window log</text><text x="292" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Store a timestamp per request. Count only</text><text x="292" y="386" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">the ones inside the trailing window.</text><text x="680" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">No — exact</text><text x="872" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">The limit has to be precise and</text><text x="872" y="385" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">you can pay for the memory.</text><rect x="60" y="446" width="1080" height="114" rx="10" fill="#101829" stroke="none" stroke-width="0" opacity="1"/><line x1="72" y1="456" x2="72" y2="550" stroke="#34D399" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="90" y="494" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">Token bucket</text><text x="292" y="488" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Tokens refill at a steady rate into a capped</text><text x="292" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">bucket. Each request spends one.</text><text x="680" y="488" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">Yes — capped at</text><text x="680" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">bucket size</text><text x="872" y="488" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Default pick. Real traffic is</text><text x="872" y="511" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">bursty and that is fine.</text><line x1="72" y1="582" x2="72" y2="676" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="90" y="620" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">Leaky bucket</text><text x="292" y="614" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Requests join a queue that drains at a</text><text x="292" y="638" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">constant rate instead of being rejected.</text><text x="680" y="614" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">No — it smooths them</text><text x="872" y="614" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Downstream load must stay flat</text><text x="872" y="637" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">and extra latency is acceptable.</text><line x1="72" y1="714" x2="1128" y2="714" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="750" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">Pick token bucket unless you have a reason not to. Then make sure the counter is shared.</text>
</svg>