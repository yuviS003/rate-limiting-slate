city="0.8"/><rect x="1040" y="404" width="90" height="13" rx="6" fill="#F87171" stroke="none" stroke-width="0" opacity="0.8"/><rect x="1085" y="426" width="45" height="13" rx="6" fill="#F87171" stroke="none" stroke-width="0" opacity="0.8"/><rect x="1085" y="448" width="45" height="13" rx="6" fill="#F87171" stroke="none" stroke-width="0" opacity="0.8"/><line x1="680" y1="476" x2="1130" y2="476" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" opacity="1"/><line x1="680" y1="476" x2="680" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="680" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">0s</text><line x1="770" y1="476" x2="770" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="770" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">2s</text><line x1="860" y1="476" x2="860" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="860" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">4s</text><line x1="950" y1="476" x2="950" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="950" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">6s</text><line x1="1040" y1="476" x2="1040" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="1040" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">8s</text><line x1="1130" y1="476" x2="1130" y2="482" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" opacity="1"/><text x="1130" y="500" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">10s</text><text x="654" y="536" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#F87171" text-anchor="start" opacity="1" letter-spacing="0">peak in flight: 12</text><text x="654" y="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Twelve handlers alive at once, holding twelve connections.</text><line x1="80" y1="618" x2="1120" y2="618" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="652" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">A rate limit cannot see duration. That is the gap a concurrency limit fills: cap requests in flight, not requests per second.</text>
</svg>