<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="720" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">Redis for speed, Postgres for truth</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Two limits with two different jobs, and nothing touching the database on the request path</text><text x="70" y="164" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.6">THE REQUEST PATH   ·   every single request</text><rect x="60" y="212" width="128" height="76" rx="12" fill="#141E35" stroke="#26334F" stroke-width="1.5" opacity="1"/><text x="124" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="0">Request</text><text x="124" y="270" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">arrives</text><rect x="228" y="164" width="616" height="32" rx="8" fill="#16233E" stroke="#26334F" stroke-width="1.2" opacity="1"/><text x="536" y="186" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">all three answered by Redis  ·  sub-millisecond  ·  zero database reads</text><path d="M 194 250 L 228 250" fill="none" stroke="#26334F" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="236" y="212" width="176" height="76" rx="12" fill="#141E35" stroke="#60A5FA" stroke-width="1.5" opacity="1"/><text x="324" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">Policy</text><text x="324" y="270" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">cached plan</text><path d="M 418 250 L 440 250" fill="none" stroke="#26334F" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="448" y="212" width="176" height="76" rx="12" fill="#141E35" stroke="#34D399" stroke-width="1.5" opacity="1"/><text x="536" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">Rate limit</text><text x="536" y="270" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">token bucket</text><path d="M 630 250 L 652 250" fill="none" stroke="#26334F" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="660" y="212" width="176" height="76" rx="12" fill="#141E35" stroke="#A78BFA" stroke-width="1.5" opacity="1"/><text x="748" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#A78BFA" text-anchor="middle" opacity="1" letter-spacing="0">Quota</text><text x="748" y="270" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">month to date</text><path d="M 842 250 L 1016 250" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arwGood)"/><rect x="1020" y="212" width="120" height="76" rx="12" fill="#141E35" stroke="#34D399" stroke-width="1.5" opacity="1"/><text x="1080" y="246" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34D399" text-anchor="middle" opacity="1" letter-spacing="0">Handler</text><text x="1080" y="270" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">does work</text><text x="70" y="452" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.6">THE DURABLE LAYER</text><rect x="380" y="484" width="440" height="132" rx="12" fill="#141E35" stroke="#60A5FA" stroke-width="1.8" opacity="1"/><text x="600" y="516" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#60A5FA" text-anchor="middle" opacity="1" letter-spacing="0">Postgres</text><text x="406" y="548" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">plans</text><text x="586" y="548" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">the policy</text><text x="406" y="572" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">customers</text><text x="586" y="572" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">who gets what</text><text x="406" y="596" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">usage_periods</text><text x="586" y="596" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">the ledger</text><path d="M 398 478 L 398 294" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="5 5" marker-end="url(#arwInfo)"/><text x="410" y="352" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">plan</text><text x="410" y="370" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">cached for 60s</text><path d="M 666 294 L 666 478" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><text x="654" y="424" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="end" opacity="1" letter-spacing="0">usage, flushed every 5s</text><text x="654" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="end" opacity="1" letter-spacing="0">aggregated per customer</text><path d="M 812 478 L 812 294" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="5 5" marker-end="url(#arw)"/><text x="824" y="352" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">quota seed</text><text x="824" y="370" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">only on a cold key</text><rect x="70" y="500" width="272" height="96" rx="12" fill="#101829" stroke="#60A5FA" stroke-width="1.4" opacity="1"/><text x="90" y="530" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">1 read</text><text x="90" y="556" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">per customer per minute, not one</text><text x="90" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">per request</text><rect x="858" y="500" width="272" height="96" rx="12" fill="#101829" stroke="#FBBF24" stroke-width="1.4" opacity="1"/><text x="878" y="530" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">1 write</text><text x="878" y="556" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">per customer per flush, not one per</text><text x="878" y="574" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">request</text><line x1="80" y1="644" x2="1120" y2="644" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="678" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">At 1,000 req/s, a usage row per request is 2.6 billion rows a month to store one number.</text>
</svg>