<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#93A4C3"/>
  </marker>
  <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
  </marker>
  <marker id="arwGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
  </marker>
  <marker id="arwInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
  </marker>
</defs>
<rect width="1200" height="660" fill="#0B1220"/>
<text x="600" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9" text-anchor="middle" opacity="1" letter-spacing="-0.6">The road from fifteen lines to production</text><text x="600" y="100" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#93A4C3" text-anchor="middle" opacity="1" letter-spacing="0">Each act fixes the thing the previous act broke on</text><rect x="51" y="148" width="255" height="408" rx="12" fill="#101829" stroke="#60A5FA" stroke-width="1.6" opacity="1"/><text x="69" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="1.8">ACT I</text><text x="69" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">The Naked Counter</text><line x1="69" y1="270" x2="288" y2="270" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="69" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU ADD</text><text x="69" y="320" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">A Map and some arithmetic. No</text><text x="69" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">dependencies at all.</text><text x="69" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU GET</text><text x="69" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">Real protection for a single</text><text x="69" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#60A5FA" text-anchor="start" opacity="1" letter-spacing="0">process, in about 15 lines.</text><text x="69" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">IT BREAKS WHEN</text><text x="69" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">You deploy a second pod and</text><text x="69" y="531" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">every limit silently doubles.</text><path d="M 310 352 L 327 352" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="332" y="148" width="255" height="408" rx="12" fill="#101829" stroke="#A78BFA" stroke-width="1.6" opacity="1"/><text x="350" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="1.8">ACT II</text><text x="350" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">One Shared Brain</text><line x1="350" y1="270" x2="569" y2="270" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="350" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU ADD</text><text x="350" y="320" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Redis, and the whole decision</text><text x="350" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">inside one Lua script.</text><text x="350" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU GET</text><text x="350" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">One true counter across every</text><text x="350" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A78BFA" text-anchor="start" opacity="1" letter-spacing="0">instance, and no races.</text><text x="350" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">IT BREAKS WHEN</text><text x="350" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Redis restarts and this month's</text><text x="350" y="531" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">billable usage is gone.</text><path d="M 591 352 L 608 352" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="613" y="148" width="255" height="408" rx="12" fill="#101829" stroke="#34D399" stroke-width="1.6" opacity="1"/><text x="631" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="1.8">ACT III</text><text x="631" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Speed and Truth</text><line x1="631" y1="270" x2="850" y2="270" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="631" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU ADD</text><text x="631" y="320" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Postgres for policy and the</text><text x="631" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">ledger. Redis stays the hot</text><text x="631" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">path.</text><text x="631" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU GET</text><text x="631" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">Per-second limits and</text><text x="631" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">per-month quotas, both</text><text x="631" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" opacity="1" letter-spacing="0">correct.</text><text x="631" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">IT BREAKS WHEN</text><text x="631" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">A single request turns out to</text><text x="631" y="531" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">cost a thousand times another.</text><path d="M 872 352 L 889 352" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" opacity="1" marker-end="url(#arw)"/><rect x="894" y="148" width="255" height="408" rx="12" fill="#101829" stroke="#FBBF24" stroke-width="1.6" opacity="1"/><text x="912" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="1.8">ACT IV</text><text x="912" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Past Requests Per</text><text x="912" y="236" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Second</text><line x1="912" y1="270" x2="1131" y2="270" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="912" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU ADD</text><text x="912" y="320" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">Concurrency caps, cost</text><text x="912" y="340" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">accounting, adaptive limits,</text><text x="912" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#E8EEF9" text-anchor="start" opacity="1" letter-spacing="0">shedding.</text><text x="912" y="400" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">YOU GET</text><text x="912" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">Limits that track what work</text><text x="912" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">actually costs, and tune</text><text x="912" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#FBBF24" text-anchor="start" opacity="1" letter-spacing="0">themselves.</text><text x="912" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">IT BREAKS WHEN</text><text x="912" y="512" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">Nothing yet. This is roughly</text><text x="912" y="531" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#93A4C3" text-anchor="start" opacity="1" letter-spacing="0">where the big APIs live.</text><line x1="80" y1="588" x2="1120" y2="588" stroke="#26334F" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="600" y="622" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FBBF24" text-anchor="middle" opacity="1" letter-spacing="0">You do not need Act IV on day one. You do need to know which act you are currently in.</text>
</svg>